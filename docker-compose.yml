services:
  # Los 5 agentes son pares: no hay ningún rol de red especial ("hub" fijo). pi-link solo
  # sabe hablar con 127.0.0.1:9900, así que cada contenedor lleva un broker
  # (docker/pi-link-broker.sh) que compite por un flock sobre un fichero en el volumen
  # compartido "pi-link-coord" para decidir quién de los 5 bindea el 127.0.0.1:9900 real
  # (el hub) mientras el resto mantiene un relay TCP local apuntando a él. Si el
  # contenedor-hub cae, el lock se libera solo y el resto vuelve a competir por el rol —
  # el resto de agentes se reconectan siguiendo la lógica de reconexión propia de pi-link,
  # sin intervención externa. Cada contenedor conserva su propia IP y sus propios puertos.
  #
  # Cada agente corre dentro de una sesión tmux persistente. Para conectarte y hablar con él:
  #   docker exec -it <container_name> tmux attach -t pi
  # Para desconectarte sin matar la sesión: Ctrl-b d
  manager:
    build:
      context: .
      dockerfile: docker/Dockerfile.pi
    image: team-pi-manager
    container_name: ${CONTAINER_PREFIX:-pi}-manager
    environment:
      - ANTHROPIC_API_KEY
      - PI_PACKAGES=
      - PI_LINK_SELF=manager
      - REPO_URL=${MANAGER_REPO_URL:-}
      - GIT_TOKEN=${MANAGER_GIT_TOKEN:-}
      - ADO_ORGANIZATION_URL
      - ADO_PROJECT
    command: ["--link-name", "manager"]
    volumes:
      - pi-link-coord:/var/run/pi-link
      - ./workspace/manager:/workspace
      - ./agents/manager/pi:/workspace/.pi
      - ./docs:/docs
      - manager-pi-home:/root/.pi/agent
      - ./agents/manager/AGENTS.md:/root/.pi/agent/AGENTS.md
      - ./cost-tracking/manager:/root/.pi/cost-tracker

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    image: team-pi-backend
    container_name: ${CONTAINER_PREFIX:-pi}-backend
    environment:
      - ANTHROPIC_API_KEY
      - PI_PACKAGES=
      - PI_LINK_SELF=backend
      - REPO_URL=${BACKEND_REPO_URL:-}
      - GIT_TOKEN=${BACKEND_GIT_TOKEN:-}
      - ADO_ORGANIZATION_URL
      - ADO_PROJECT
      - VNC_PASSWORD=${BACKEND_VNC_PASSWORD:-}
    command: ["--link-name", "backend"]
    # Por defecto solo en loopback del host: si docker compose corre en una máquina remota,
    # entra por túnel SSH (ver "Remote VS Code" en el README), no exponiendo este puerto a la
    # red. BACKEND_VNC_BIND existe para el caso WSL2 (ver README) — el reenvío automático de
    # localhost de WSL2 hacia Windows entra por la interfaz virtual de la VM, no por loopback,
    # así que un publish 127.0.0.1 dentro de la VM nunca lo ve.
    ports:
      - "${BACKEND_VNC_BIND:-127.0.0.1}:${BACKEND_VNC_PORT:-6080}:6080"
    volumes:
      - pi-link-coord:/var/run/pi-link
      - ./workspace/backend:/workspace
      - ./agents/backend/pi:/workspace/.pi
      - ./docs:/docs
      - backend-pi-home:/root/.pi/agent
      - ./agents/backend/AGENTS.md:/root/.pi/agent/AGENTS.md
      - ./cost-tracking/backend:/root/.pi/cost-tracker
      - backend-eclipse-workspace:/root/eclipse-workspace

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.pi
    image: team-pi-frontend
    container_name: ${CONTAINER_PREFIX:-pi}-frontend
    environment:
      - ANTHROPIC_API_KEY
      - PI_PACKAGES=
      - PI_LINK_SELF=frontend
      - REPO_URL=${FRONTEND_REPO_URL:-}
      - GIT_TOKEN=${FRONTEND_GIT_TOKEN:-}
      - ADO_ORGANIZATION_URL
      - ADO_PROJECT
    command: ["--link-name", "frontend"]
    volumes:
      - pi-link-coord:/var/run/pi-link
      - ./workspace/frontend:/workspace
      - ./agents/frontend/pi:/workspace/.pi
      - ./docs:/docs
      - frontend-pi-home:/root/.pi/agent
      - ./agents/frontend/AGENTS.md:/root/.pi/agent/AGENTS.md
      - ./cost-tracking/frontend:/root/.pi/cost-tracker

  devops:
    build:
      context: .
      dockerfile: docker/Dockerfile.pi
    image: team-pi-devops
    container_name: ${CONTAINER_PREFIX:-pi}-devops
    environment:
      - ANTHROPIC_API_KEY
      - PI_PACKAGES=
      - PI_LINK_SELF=devops
      - REPO_URL=${DEVOPS_REPO_URL:-}
      - GIT_TOKEN=${DEVOPS_GIT_TOKEN:-}
      - ADO_ORGANIZATION_URL
      - ADO_PROJECT
    command: ["--link-name", "devops"]
    volumes:
      - pi-link-coord:/var/run/pi-link
      - ./workspace/devops:/workspace
      - ./agents/devops/pi:/workspace/.pi
      - ./docs:/docs
      - devops-pi-home:/root/.pi/agent
      - ./agents/devops/AGENTS.md:/root/.pi/agent/AGENTS.md
      - ./cost-tracking/devops:/root/.pi/cost-tracker

  cypress:
    build:
      context: .
      dockerfile: docker/Dockerfile.cypress
    image: team-pi-cypress
    container_name: ${CONTAINER_PREFIX:-pi}-cypress
    environment:
      - ANTHROPIC_API_KEY
      - PI_PACKAGES=
      - PI_LINK_SELF=cypress
      - REPO_URL=${CYPRESS_REPO_URL:-}
      - GIT_TOKEN=${CYPRESS_GIT_TOKEN:-}
      - ADO_ORGANIZATION_URL
      - ADO_PROJECT
    command: ["--link-name", "cypress"]
    volumes:
      - pi-link-coord:/var/run/pi-link
      - ./workspace/cypress:/workspace
      - ./agents/cypress/pi:/workspace/.pi
      - ./docs:/docs
      - cypress-pi-home:/root/.pi/agent
      - ./agents/cypress/AGENTS.md:/root/.pi/agent/AGENTS.md
      - ./cost-tracking/cypress:/root/.pi/cost-tracker

# El nombre de referencia de cada volumen (la clave YAML) es fijo y es lo que usan los
# servicios de arriba para citarlo; el nombre real del volumen en Docker (`name:`) sí usa
# CONTAINER_PREFIX, con el mismo criterio que container_name. Compose no permite
# interpolar variables en las propias claves de este bloque, solo en valores como `name:`.
volumes:
  pi-link-coord:
    name: ${CONTAINER_PREFIX:-pi}-link-coord
  manager-pi-home:
    name: manager-${CONTAINER_PREFIX:-pi}-home
  backend-pi-home:
    name: backend-${CONTAINER_PREFIX:-pi}-home
  backend-eclipse-workspace:
  frontend-pi-home:
    name: frontend-${CONTAINER_PREFIX:-pi}-home
  devops-pi-home:
    name: devops-${CONTAINER_PREFIX:-pi}-home
  cypress-pi-home:
    name: cypress-${CONTAINER_PREFIX:-pi}-home
