<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>API · consola team-pi</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/style.css" />
  <style>
    body { max-width: 980px; margin: 0 auto; padding: 24px 20px 80px; }
    .top { display: flex; gap: 12px; align-items: baseline; justify-content: space-between; flex-wrap: wrap; }
    .top a { color: var(--accent); }
    .md h1 { margin-top: 0; }
    .md { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <p class="top meta">
    <a href="/">← consola</a>
    <span>Esta página se genera de <a href="/api.md">/api.md</a> (Markdown, para agentes: <code>curl $CONSOLE_URL/api.md</code>)</span>
  </p>
  <article id="doc" class="md"><p class="meta">Cargando…</p></article>

  <!-- marked desde CDN con la versión fijada, como el resto de la consola. Sin red se enseña el
       Markdown tal cual, que sigue siendo legible. -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script>
    (async () => {
      const doc = document.getElementById("doc");
      const r = await fetch("/api.md");
      const text = await r.text();
      if (!r.ok) { doc.textContent = `No se pudo cargar /api.md (HTTP ${r.status})`; return; }
      if (!window.marked) {
        const pre = document.createElement("pre");
        pre.textContent = text;
        doc.replaceChildren(pre);
        return;
      }
      // El documento es de este repositorio, no de un tercero: no necesita sanearse.
      doc.innerHTML = window.marked.parse(text, { gfm: true });
      // Ids de los títulos, para que funcionen los enlaces internos (#costes, #skills-y-agentsmd…).
      doc.querySelectorAll("h1,h2,h3").forEach((h) => {
        h.id = h.textContent.toLowerCase().trim().replace(/[^\p{L}\p{N}\s-]/gu, "").replace(/\s+/g, "-");
      });
      if (location.hash) document.getElementById(decodeURIComponent(location.hash.slice(1)))?.scrollIntoView();
    })();
  </script>
</body>
</html>
